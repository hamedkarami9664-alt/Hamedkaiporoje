name: Build Elden Ring Guide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/eldenring/fa
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EldenRingGuide"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.eldenring.fa"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.eldenring.fa"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Elden Ring Guide"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/eldenring/fa/MainActivity.kt <<'EOF'
          package com.eldenring.fa

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              private val gold = Color.rgb(218, 184, 105)
              private val dark = Color.rgb(22, 22, 22)
              private lateinit var content: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = dark
                  window.navigationBarColor = dark
                  showHome()
              }

              private fun label(value: String, size: Float): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(Color.WHITE)
                      setPadding(20, 18, 20, 18)
                  }
              }

              private fun addButton(title: String, action: () -> Unit) {
                  content.addView(Button(this).apply {
                      text = title
                      setOnClickListener { action() }
                  })
              }

              private fun page(title: String) {
                  val scroll = ScrollView(this)
                  content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 16, 16, 24)
                      setBackgroundColor(dark)
                  }
                  scroll.addView(content)
                  setContentView(scroll)
                  content.addView(label(title, 25f).apply {
                      setTextColor(gold)
                      gravity = Gravity.CENTER
                  })
              }

              private fun showHome() {
                  page("ELDEN RING GUIDE")
                  content.addView(label(
                      "A beginner's guide to the Lands Between.",
                      18f
                  ))
                  addButton("Beginner Tips") {
                      showSection("Beginner Tips",
                          "Explore Limgrave first. Activate Sites of Grace. " +
                          "Collect Golden Seeds and Sacred Tears. Upgrade " +
                          "your weapons and learn enemy attack patterns.")
                  }
                  addButton("Stats and Attributes") {
                      showSection("Stats and Attributes",
                          "Vigor: maximum HP. Mind: FP. Endurance: stamina " +
                          "and equip load. Strength and Dexterity: weapon " +
                          "scaling. Intelligence: sorceries. Faith: " +
                          "incantations. Arcane: discovery and special abilities.")
                  }
                  addButton("Combat Basics") {
                      showSection("Combat Basics",
                          "Lock on to enemies. Time your dodges. Manage stamina. " +
                          "Try guard counters and heavy attacks to break stance.")
                  }
                  addButton("Exploration") {
                      showSection("Exploration",
                          "Explore caves, ruins and tunnels. Find map fragments. " +
                          "Visit churches and look for Golden Seeds.")
                  }
                  addButton("Boss Preparation") {
                      showSection("Boss Preparation",
                          "Upgrade weapons, bring healing flasks, study attack " +
                          "patterns and return later if a boss is too difficult.")
                  }
              }

              private fun showSection(title: String, body: String) {
                  page(title)
                  content.addView(label(body, 18f))
                  addButton("Back to Home") { showHome() }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify Kotlin Compilation
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/tmp/kotlin-classes/debug/com/eldenring/fa/MainActivity.class
          echo "MainActivity Kotlin compilation verified."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elden-Ring-Guide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
